# DO NOT commit banking-secrets with real values.
# Generate at deploy time: scripts/k8s-create-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: banking-secrets
  namespace: banking
type: Opaque
stringData:
  JWT_SECRET: change_me_jwt_secret_min_32_chars_long
  JWT_REFRESH_SECRET: change_me_refresh_secret_min_32_chars
  INTERNAL_SERVICE_SECRET: change_me_internal_service_secret
  POSTGRES_PASSWORD: bank_dev_password_change_me
  SPLUNK_REALM: us1
  SPLUNK_ACCESS_TOKEN: not-configured
  SPLUNK_INGEST_URL: https://ingest.us1.signalfx.com
  SPLUNK_LOG_INGEST_URL: https://ingest.us1.signalfx.com/v1/log
  SPLUNK_API_URL: https://api.us1.signalfx.com
