# Splunk OpenTelemetry Collector for SecureBank → Splunk Observability Cloud
# Requires .env.splunk with SPLUNK_ACCESS_TOKEN, SPLUNK_REALM, SPLUNK_INGEST_URL, SPLUNK_API_URL
# OpAMP enrollment (Fleet Management) uses SPLUNK_OPAMP_URL — see .env.splunk.example

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  opamp/splunk_o11y:
    agent_description:
      include_resource_attributes: true
    server:
      http:
        endpoint: ${SPLUNK_OPAMP_URL}
        polling_interval: 30s
        headers:
          X-SF-Token: ${SPLUNK_ACCESS_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
  resource/add_environment:
    attributes:
      - key: deployment.environment.name
        value: ${DEPLOYMENT_ENVIRONMENT}
        action: upsert
      - key: deployment.environment
        value: ${DEPLOYMENT_ENVIRONMENT}
        action: upsert
      - key: demo.name
        value: banking-platform
        action: upsert

exporters:
  otlphttp/traces:
    traces_endpoint: ${SPLUNK_INGEST_URL}/v2/trace/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}
  splunk_hec/o11y:
    token: ${SPLUNK_ACCESS_TOKEN}
    endpoint: ${SPLUNK_LOG_INGEST_URL}
    source: banking-platform
    sourcetype: otel
  signalfx:
    access_token: ${SPLUNK_ACCESS_TOKEN}
    realm: ${SPLUNK_REALM}
    ingest_url: ${SPLUNK_INGEST_URL}
    api_url: ${SPLUNK_API_URL}
  debug:
    verbosity: basic

service:
  extensions: [health_check, opamp/splunk_o11y]
  telemetry:
    resource:
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT}
      otelcol.service.mode: gateway
      demo.name: banking-platform
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [otlphttp/traces, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [signalfx, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [splunk_hec/o11y, debug]
