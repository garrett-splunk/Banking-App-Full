# Shared observability environment for all Node services
x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-banking-app}
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-banking-app},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-banking-app},service.namespace=securebank,demo.name=banking-platform
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  ADMIN_SERVICE_URL: http://admin-service:3009

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank_dev_password_change_me
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  otel-collector:
    image: quay.io/signalfx/splunk-otel-collector:0.154.2
    command: ["--config=/etc/otelcol/config.yaml", "--feature-gates=+splunk.opamp.enabled"]
    volumes:
      - ./collector/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    env_file:
      - path: .env.splunk
        required: false
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-banking-app}
      # Splunk credentials come from .env.splunk only (env_file).
      # Do not set SPLUNK_* here — environment overrides env_file and would ignore .env.splunk.
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/auth_db
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "3001:3001"

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: user-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/user_db
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "3002:3002"

  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: account-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/account_db
      PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "3003:3003"

  transaction-service:
    build:
      context: .
      dockerfile: services/transaction-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: transaction-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/transaction_db
      PORT: 3004
    depends_on:
      - account-service
      - notification-service
      - otel-collector
    ports:
      - "3004:3004"

  credit-card-service:
    build:
      context: .
      dockerfile: services/credit-card-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: credit-card-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/creditcard_db
      PORT: 3005
    depends_on:
      - user-service
      - document-service
      - account-service
      - notification-service
      - otel-collector
    ports:
      - "3005:3005"

  loan-service:
    build:
      context: .
      dockerfile: services/loan-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: loan-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/loan_db
      PORT: 3006
    depends_on:
      - user-service
      - document-service
      - account-service
      - notification-service
      - otel-collector
    ports:
      - "3006:3006"

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: document-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/document_db
      PORT: 3007
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "3007:3007"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: notification-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/notification_db
      PORT: 3008
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "3008:3008"

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: admin-service
      DATABASE_URL: postgresql://bank:bank_dev_password_change_me@postgres:5432/admin_db
      PORT: 3009
    depends_on:
      - credit-card-service
      - loan-service
      - user-service
      - notification-service
      - otel-collector
    ports:
      - "3009:3009"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: api-gateway
      PORT: 8080
    depends_on:
      - auth-service
      - user-service
      - account-service
      - transaction-service
      - credit-card-service
      - loan-service
      - document-service
      - notification-service
      - admin-service
      - otel-collector
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
      - path: .env.splunk
        required: false
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://api-gateway:8080
      VITE_SPLUNK_REALM: ${SPLUNK_REALM:-us1}
      VITE_SPLUNK_RUM_ACCESS_TOKEN: ${SPLUNK_RUM_ACCESS_TOKEN:-}
      VITE_DEPLOYMENT_ENVIRONMENT: banking-app
    depends_on:
      - api-gateway
    ports:
      - "5173:5173"

  workshop-site:
    image: nginx:alpine
    volumes:
      - ./workshop-site:/usr/share/nginx/html:ro
    ports:
      - "8090:80"

volumes:
  postgres_data:
  document_uploads:
